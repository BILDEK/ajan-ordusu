name: Ajan Ordusu

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ajan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri kur
        run: pip install requests

      - name: Ajani calistir
        run: python ajan.py
